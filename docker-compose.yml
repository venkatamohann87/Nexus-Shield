services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://humanshield:humanshield@postgres:5432/humanshield
      AUTH_SECRET: replace-this-before-production
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: humanshield
      POSTGRES_USER: humanshield
      POSTGRES_PASSWORD: humanshield
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U humanshield -d humanshield"]
      interval: 5s
      timeout: 5s
      retries: 10
